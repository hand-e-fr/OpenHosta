[mypy]
python_version = 3.12
strict = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
follow_imports = silent

# V5 agent/: explicitly strict
[mypy-openhosta.agent.*]
strict = True

# V5 guarded/: strict with exceptions for primitives (heavy metaprogramming)
[mypy-openhosta.guarded.*]
strict = True

[mypy-openhosta.guarded.primitives]
disallow_untyped_defs = False
check_untyped_defs = False
warn_return_any = False
