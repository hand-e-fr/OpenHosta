[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openhosta"
version = "5.0.0-dev"
description = "Semantic layer for Python — AI-as-a-Function. Write what you mean. Python does the rest."
keywords = ["AI", "LLM", "Python", "Guarded Types", "Agent Runtime", "Semantic"]
authors = [
  { name="Léandre Ramos"},
  { name="Merlin Devillard"},
  { name="William Jolivet"},
  { name="Emmanuel Batt"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "ruff>=0.6.0",
    "bandit>=1.7.10",
]
tests = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pillow>=11.0.0",
    "pydantic>=2.8.2",
    "Flask>=3.0.3",
    "python-dotenv>=1.1.1"
]

[project.urls]
Homepage = "https://github.com/hand-e-fr/OpenHosta"
Issues = "https://github.com/hand-e-fr/OpenHosta/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.bandit]
skips = ["B112"]
targets = ["src/openhosta"]
recursive = true

[tool.mypy]
disable_error_code = ["attr-defined"]
